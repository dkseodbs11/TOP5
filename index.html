<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
}


/* ===============================
   HEADER
================================ */

header {
    background: #fff;
    padding: 28px 3%;
    border-bottom: 1px solid #e5e5e5;
}

.store-name {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 7px;
}

header h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 58px);
    line-height: 0.9;
    letter-spacing: -3px;
    font-weight: 900;
}

.header-text {
    margin-top: 14px;
    font-size: 12px;
    color: #707072;
}


/* ===============================
   MAIN
================================ */

main {
    width: 100%;
    max-width: 1600px;
    margin: auto;
    padding: 24px 2%;
}


/* ===============================
   CATEGORY
================================ */

.category {
    margin-bottom: 44px;
}

.category-title {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 12px;
}

.category-title h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -1px;
}

.category-title span {
    font-size: 9px;
    color: #707072;
    letter-spacing: 1px;
}


/* ===============================
   5 COLUMN GRID
================================ */

.products {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
}


/* ===============================
   CARD
================================ */

.card {
    position: relative;
    min-width: 0;
    background: #fff;
    overflow: hidden;
}


/* 순위 */

.rank {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;

    width: 29px;
    height: 29px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #111;
    color: #fff;

    font-size: 9px;
    font-weight: 800;
}


/* ===============================
   PRODUCT IMAGE
================================ */

.image-area {
    height: 180px;
    background: #f1f1f1;
    overflow: hidden;
}

.image-link {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;
}

.product-image {
    width: 98%;
    height: 98%;

    object-fit: contain;

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.image-link:hover .product-image {
    transform: scale(1.04);
    opacity: 0.92;
}

.image-link:active .product-image {
    transform: scale(0.97);
}


/* ===============================
   INFO
================================ */

.info {
    padding: 10px;
}

.product-name {
    min-height: 30px;

    font-size: 12px;
    font-weight: 900;
    line-height: 1.15;

    margin-bottom: 5px;
}

.style-code {
    font-size: 9px;
    color: #707072;

    margin-bottom: 3px;
}

.price {
    margin-top: 6px;
    margin-bottom: 10px;

    font-size: 13px;
    font-weight: 900;
}


/* ===============================
   BARCODE
================================ */

.barcode-area {
    border-top: 1px solid #e5e5e5;
    padding-top: 8px;
}

.barcode-title {
    font-size: 7px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #707072;

    margin-bottom: 5px;
}

.barcode-box {
    width: 100%;
    background: #fff;
    overflow: hidden;
}

.barcode-box svg {
    width: 100%;
    height: auto;
    display: block;
}


/* ===============================
   GALAXY TAB
================================ */

@media (max-width: 1100px) {

    main {
        padding: 18px 8px;
    }

    .products {
        grid-template-columns:
            repeat(5, minmax(0, 1fr));

        gap: 6px;
    }

    .image-area {
        height: 150px;
    }

    .product-image {
        width: 98%;
        height: 98%;
    }

    .info {
        padding: 8px;
    }

    .product-name {
        font-size: 10px;
        min-height: 27px;
    }

    .style-code {
        font-size: 8px;
    }

    .price {
        font-size: 11px;
    }

}


/* ===============================
   PHONE
================================ */

@media (max-width: 600px) {

    .products {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .image-area {
        height: 180px;
    }

}


/* ===============================
   FOOTER
================================ */

footer {
    padding: 20px 3% 40px;

    color: #999;
    font-size: 8px;
    letter-spacing: 2px;
}

</style>

/* =====================================================
   카드 생성
===================================================== */

function createProductCards(
    containerId,
    category,
    products
) {

    const container =
        document.getElementById(
            containerId
        );


    products.forEach(
        (product, index) => {


        const rank =
            String(index + 1)
            .padStart(
                2,
                "0"
            );


        const barcodeId =
            `${category}Barcode${index + 1}`;


        const card =
            document.createElement(
                "article"
            );


        card.className =
            "card";


        card.innerHTML = `

            <div class="rank">
                ${rank}
            </div>


            <div class="image-area">

                <a
                    class="image-link"
                    href="${product.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="${product.name} 제품 페이지 열기"
                >

                    <img
                        src="${product.image}"
                        class="product-image"
                        alt="${product.name}"
                    >

                </a>

            </div>


            <div class="info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="style-code">
                    ${product.styleCode}
                </div>

                <div class="price">
                    ${product.price}
                </div>


                <div class="barcode-area">

                    <div class="barcode-title">
                        SCAN TO ORDER
                    </div>

                    <div class="barcode-box">

                        <svg
                            id="${barcodeId}"
                        ></svg>

                    </div>

                </div>

            </div>

        `;


        container.appendChild(
            card
        );


        /* =============================
           CW2288-111과 동일한
           UPC-A 렌더링 스타일
        ============================== */

        JsBarcode(

            `#${barcodeId}`,

            product.barcode,

            {

                format: "UPC",

                width: 2,

                height: 52,

                displayValue: true,

                fontSize: 10,

                textMargin: 3,

                margin: 3,

                background:
                    "#ffffff",

                lineColor:
                    "#000000"

            }

        );


    });

}
