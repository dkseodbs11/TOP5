<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEEKLY ORDER PICKS</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    background: #ffffff;
    padding: 28px 3%;
    border-bottom: 1px solid #e5e5e5;
}

.store-name {
    margin-bottom: 7px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;
}

header h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 58px);
    line-height: 0.9;
    letter-spacing: -3px;
    font-weight: 900;
}

.header-text {
    margin-top: 14px;
    color: #707072;
    font-size: 12px;
}

/* =========================
   MAIN
========================= */

main {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px 2%;
}

/* =========================
   CATEGORY
========================= */

.category {
    margin-bottom: 42px;
}

.category-title {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    margin-bottom: 12px;
}

.category-title h2 {
    margin: 0;

    font-size: 22px;
    font-weight: 900;

    letter-spacing: -1px;
}

.category-title span {
    color: #707072;

    font-size: 9px;
    letter-spacing: 1px;
}

/* =========================
   가로 5개
========================= */

.products {
    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 8px;
}

/* =========================
   CARD
========================= */

.card {
    position: relative;

    min-width: 0;

    overflow: hidden;

    background: #ffffff;
}

.rank {
    position: absolute;

    top: 10px;
    left: 10px;

    z-index: 5;

    width: 29px;
    height: 29px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #111111;
    color: #ffffff;

    font-size: 9px;
    font-weight: 800;
}

/* =========================
   PRODUCT IMAGE
========================= */

.image-area {

    /* 이전보다 크게 */
    height: 180px;

    overflow: hidden;

    background: #f1f1f1;
}

.image-link {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    text-decoration: none;
}

.product-image {

    /* 상품을 거의 꽉 차게 */
    width: 98%;
    height: 98%;

    object-fit: contain;

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.image-link:hover .product-image {

    transform:
        scale(1.04);

    opacity: 0.92;
}

.image-link:active .product-image {

    transform:
        scale(0.97);
}

/* =========================
   PRODUCT INFO
========================= */

.info {
    padding: 10px;
}

.product-name {

    min-height: 29px;

    margin-bottom: 4px;

    font-size: 12px;

    font-weight: 900;

    line-height: 1.15;

    letter-spacing: -0.3px;
}

.style-code {

    margin-bottom: 3px;

    color: #707072;

    font-size: 9px;
}

.price {

    margin-top: 6px;

    margin-bottom: 10px;

    font-size: 13px;

    font-weight: 900;
}

/* =========================
   BARCODE
========================= */

.barcode-area {

    padding-top: 8px;

    border-top:
        1px solid #e5e5e5;
}

.barcode-title {

    margin-bottom: 4px;

    color: #707072;

    font-size: 7px;

    font-weight: 800;

    letter-spacing: 1px;
}

.barcode-box {

    width: 100%;

    overflow: hidden;

    background: #ffffff;
}

.barcode-box svg {

    width: 100%;

    height: auto;

    display: block;
}

/* =========================
   EMPTY CARD
========================= */

.placeholder-image {

    color: #aaaaaa;

    font-size: 9px;

    font-weight: 800;

    text-align: center;
}

.empty-info {

    margin-top: 8px;

    color: #aaaaaa;

    font-size: 8px;
}

/* =========================
   GALAXY TAB

   5열 유지 +
   사진 크게
========================= */

@media (max-width: 1100px) {

    main {

        padding:
            18px
            8px;
    }

    .products {

        grid-template-columns:
            repeat(
                5,
                minmax(0, 1fr)
            );

        gap: 6px;
    }

    /* 핵심 변경 */
    .image-area {

        height: 150px;
    }

    .product-image {

        width: 98%;

        height: 98%;
    }

    .info {

        padding: 8px;
    }

    .product-name {

        min-height: 25px;

        font-size: 10px;
    }

    .style-code {

        font-size: 8px;
    }

    .price {

        font-size: 11px;
    }

    .barcode-title {

        font-size: 6px;
    }
}

/* =========================
   PHONE
========================= */

@media (max-width: 600px) {

    .products {

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );
    }

    .image-area {

        height: 180px;
    }
}

/* =========================
   FOOTER
========================= */

footer {

    padding:
        20px
        3%
        40px;

    color: #999999;

    font-size: 8px;

    letter-spacing: 2px;
}

</style>

</head>


<body>


<header>

<div class="store-name">

SONGDO · WEEKLY PICKS

</div>


<h1>

WEEKLY<br>
ORDER PICKS

</h1>


<div class="header-text">

카테고리별 이번 주 추천 제품

</div>

</header>



<main>


<!-- =========================
     FOOTWEAR
========================= -->

<section class="category">


<div class="category-title">

<h2>
FOOTWEAR TOP 5
</h2>

<span>
THIS WEEK
</span>

</div>


<div
class="products"
id="footwearProducts">
</div>


</section>



<!-- =========================
     APPAREL
========================= -->

<section class="category">


<div class="category-title">

<h2>
APPAREL TOP 5
</h2>

<span>
THIS WEEK
</span>

</div>


<div
class="products"
id="apparelProducts">
</div>


</section>



<!-- =========================
     EQUIPMENT
========================= -->

<section class="category">


<div class="category-title">

<h2>
EQUIPMENT TOP 5
</h2>

<span>
THIS WEEK
</span>

</div>


<div
class="products"
id="equipmentProducts">
</div>


</section>


</main>



<footer>

SONGDO · WEEKLY ORDER PICKS

</footer>



<script>

/* ======================================
   FOOTWEAR DATA
====================================== */

const footwearProducts = [


{
    rank: "01",

    name: "AIR FORCE 1 '07",

    styleCode: "CW2288-111",

    price: "₩149,000",

    image:
    "./images/CW2288-111.png",

    link:
    "https://www.nike.com/kr/t/%EB%82%98%EC%9D%B4%ED%82%A4-%EC%97%90%EC%96%B4-%ED%8F%AC%EC%8A%A4-1-07-%EB%82%A8%EC%84%B1-%EC%8B%A0%EB%B0%9C-qdjlTENZ/CW2288-111",

    upc:
    "194500874909"
},


{
    rank: "02",

    name:
    "AIR FORCE 1 '07 WB",

    styleCode:
    "CJ9179-200",

    price:
    "₩169,000",

    image:
    "./images/CJ9179-200.png",

    link:
    "https://www.nike.com/kr/t/%EB%82%98%EC%9D%B4%ED%82%A4-%EC%97%90%EC%96%B4-%ED%8F%AC%EC%8A%A4-1-07-wb-%EB%82%A8%EC%84%B1-%EC%8B%A0%EB%B0%9C-8GsD4QyI/CJ9179-200",

    upc:
    "193152246874"
},


{
    rank: "03",

    name:
    "AIR FORCE 1 '07",

    styleCode:
    "FQ8901-259",

    price:
    "₩169,000",

    image:
    "./images/FQ8901-259.png",

    link:
    "https://www.nike.com/kr/t/%EB%82%98%EC%9D%B4%ED%82%A4-%EC%97%90%EC%96%B4-%ED%8F%AC%EC%8A%A4-1-07-%EC%97%AC%EC%84%B1-%EC%8B%A0%EB%B0%9C-oC22E7Fz/FQ8901-259",

    upc:
    "196969790400"
},


{
    rank: "04",

    name:
    "NIKE BURROW SE",

    styleCode:
    "HV8561-002",

    price:
    "₩79,000",

    image:
    "./images/HV8561-002.png",

    link:
    "https://www.nike.com/kr/t/%EB%82%98%EC%9D%B4%ED%82%A4-%EB%B2%84%EB%A1%9C%EC%9A%B0-se-%EB%82%A8%EC%84%B1-%EC%8A%AC%EB%A6%AC%ED%8D%BC-YVctXDOl/HV8561-002",

    upc:
    "198486699280"
},


{
    rank: "05",

    name:
    "W NIKE BURROW SE",

    styleCode:
    "DR8882-100",

    price:
    "₩79,000",

    image:
    "./images/DR8882-100.png",

    link:
    "https://www.nike.com/kr/t/%EB%82%98%EC%9D%B4%ED%82%A4-%EB%B2%84%EB%A1%9C%EC%9A%B0-se-%EC%97%AC%EC%84%B1-%EC%8A%AC%EB%A6%AC%ED%8D%BC-H9vZoFik/DR8882-100",

    upc:
    "196151990410"
}


];



/* ======================================
   FOOTWEAR CARD 생성
====================================== */

function createFootwearCards() {


const container =

document.getElementById(
"footwearProducts"
);


footwearProducts.forEach(
(product, index) => {


const barcodeId =

`barcode${index + 1}`;


const card =

document.createElement(
"article"
);


card.className =
"card";


card.innerHTML = `


<div class="rank">

${product.rank}

</div>


<div class="image-area">


<a

class="image-link"

href="${product.link}"

target="_blank"

rel="noopener noreferrer"

aria-label="${product.name} 제품 페이지 열기"

>


<img

src="${product.image}"

class="product-image"

alt="${product.name}"

>


</a>


</div>



<div class="info">


<div class="product-name">

${product.name}

</div>


<div class="style-code">

${product.styleCode}

</div>


<div class="price">

${product.price}

</div>



<div class="barcode-area">


<div class="barcode-title">

SCAN TO ORDER

</div>


<div class="barcode-box">

<svg id="${barcodeId}"></svg>

</div>


</div>


</div>


`;


container.appendChild(
card
);



/* UPC 바코드 */

JsBarcode(

`#${barcodeId}`,

product.upc,

{

format: "UPC",

width: 2,

height: 52,

displayValue: true,

fontSize: 10,

textMargin: 3,

margin: 3,

background:
"#ffffff",

lineColor:
"#000000"

}

);


}

);


}



/* ======================================
   APPAREL / EQUIPMENT
   빈카드 생성
====================================== */

function createEmptyCards(
containerId
) {


const container =

document.getElementById(
containerId
);


for (
let i = 1;
i <= 5;
i++
) {


const rank =

String(i)
.padStart(
2,
"0"
);


const card =

document.createElement(
"article"
);


card.className =
"card";


card.innerHTML = `


<div class="rank">

${rank}

</div>


<div class="image-area">


<div class="image-link">


<div class="placeholder-image">

PRODUCT IMAGE

</div>


</div>


</div>



<div class="info">


<div class="product-name">

PRODUCT NAME

</div>


<div class="style-code">

STYLE CODE

</div>


<div class="price">

₩0

</div>


<div class="empty-info">

제품 정보 입력 예정

</div>


</div>


`;


container.appendChild(
card
);


}


}



/* 페이지 생성 */

createFootwearCards();


createEmptyCards(
"apparelProducts"
);


createEmptyCards(
"equipmentProducts"
);


</script>


</body>

</html>
